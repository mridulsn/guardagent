[project]
name = "guardagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "pydantic>=2.14.3",
    "sqlglot>=30.33.0",
]

[project.scripts]
guardagent = "guardagent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
